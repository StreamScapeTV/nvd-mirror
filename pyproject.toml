[project]
name = "nvd-mirror"
version = "0.1.0"
description = "Self-hosted NVD JSON feed mirror with an NVD CVE API-compatible read endpoint"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
[project.urls]
Homepage = "https://github.com/StreamScapeTV/nvd-mirror"
Repository = "https://github.com/StreamScapeTV/nvd-mirror"
Issues = "https://github.com/StreamScapeTV/nvd-mirror/issues"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that call a configured live NVD feed source or running service"]
