replicaCount: 1

image:
  repository: ghcr.io/mimranfaruqi/nvd-mirror
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nvd.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

scheduler:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

bootstrap:
  enabled: true
  force: false
  markerFile: /data/mirror/nvd/.helm-bootstrap-complete
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  enabled: true
  retain: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}

# Set database.existingSecret to a Secret containing DATABASE_URL, or set
# database.url when postgresql.enabled=false. The in-chart PostgreSQL service
# is intended for simple single-instance installations.
database:
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  url: ""

nvdApiKey:
  existingSecret: ""
  existingSecretKey: NVD_API_KEY
  value: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    database: nvd
    username: nvd
    password: ""
  service:
    port: 5432
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

config:
  appName: nvd-mirror
  appVersion: ""
  host: 0.0.0.0
  port: 8000
  nvdMirrorBaseUrl: https://nvd.nist.gov/feeds/json/cve/2.0
  nvdFeedUpstreamBaseUrl: ""
  nvdFeedSourceMode: managed
  nvdFeedMirrorDir: /data/mirror/nvd
  nvdApiCvesUrl: https://services.nvd.nist.gov/rest/json/cves/2.0
  nvdApiCpesUrl: https://services.nvd.nist.gov/rest/json/cpes/2.0
  liveNvdTotalCacheTtlSeconds: 300
  dashboardStatsCacheSeconds: 600
  nvdUpstreamRequestDelaySeconds: 6
  nvdUpstreamRetries: 10
  nvdUpstreamRetryBackoffSeconds: 15
  nvdDownloadProgressIntervalBytes: 52428800
  nvdUserAgent: ""
  requestTimeoutSeconds: 900
  defaultFromYear: 2002
  maxResultsPerPage: 2000
  validateMeta: true
  validateGzSize: true
  validateUncompressedSize: true
  validateUncompressedSha256: true
  upstreamVerifyTls: true
  upstreamCaBundle: ""
  tlsCertFile: ""
  tlsKeyFile: ""
  schedulerRunOnStartup: modified
  schedulerMaxSleepSeconds: 60
  nvdSyncTimezone: America/New_York
  nvdSyncModifiedEnabled: true
  nvdSyncModifiedEveryHours: 1
  nvdSyncModifiedMinute: 25
  nvdSyncDailyMirrorEnabled: true
  nvdSyncDailyMirrorHour: 3
  nvdSyncDailyMirrorMinute: 15
  nvdSyncDailyMirrorForce: false

certificates:
  existingSecret: ""
  mountPath: /certs

additionalEnv: []
additionalEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
