{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvd-mirror.postgresqlFullname" . }}
  labels:
    {{- include "nvd-mirror.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "nvd-mirror.postgresqlSelectorLabels" . | nindent 4 }}
{{- end }}
