name: Helm chart

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
      - 'README.md'
      - 'docs/VALIDATION.md'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
      - 'README.md'
      - 'docs/VALIDATION.md'
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to publish, for example 0.1.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version: ['v3.21.3', 'v4.2.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Lint chart
        run: >-
          helm lint charts/nvd-mirror
          --set-string postgresql.auth.password=ci-password
          --set bootstrap.enabled=false

      - name: Render included PostgreSQL installation
        run: |
          helm template nvd-mirror charts/nvd-mirror \
            --namespace nvd-mirror \
            --set-string postgresql.auth.password=ci-password \
            --set bootstrap.enabled=false \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set-string ingress.hosts[0].host=nvd.example.org \
            > /tmp/nvd-mirror-internal.yaml
          test -s /tmp/nvd-mirror-internal.yaml

      - name: Render external PostgreSQL installation
        run: |
          helm template nvd-mirror charts/nvd-mirror \
            --namespace nvd-mirror \
            --set postgresql.enabled=false \
            --set-string database.url='postgresql+psycopg://nvd:password@postgres.example:5432/nvd' \
            --set bootstrap.enabled=false \
            > /tmp/nvd-mirror-external.yaml
          test -s /tmp/nvd-mirror-external.yaml

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/nvd-mirror --destination dist
          test -f dist/nvd-mirror-0.1.0.tgz

  publish:
    name: Publish OCI chart
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Determine release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${REQUESTED_VERSION}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic, for example 0.1.0; got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          helm package charts/nvd-mirror \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Log in to GitHub Container Registry
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push chart to GHCR
        id: push
        shell: bash
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="oci://ghcr.io/${owner}/charts"
          helm push "dist/nvd-mirror-${VERSION}.tgz" "$repository"
          echo "reference=${repository}/nvd-mirror" >> "$GITHUB_OUTPUT"

      - name: Verify published chart
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          REFERENCE: ${{ steps.push.outputs.reference }}
          VERSION: ${{ steps.version.outputs.version }}
        run: helm show chart "$REFERENCE" --version "$VERSION"
