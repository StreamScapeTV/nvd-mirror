name: Helm chart

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
      - 'README.md'
      - 'docs/VALIDATION.md'
      - 'app/version.py'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.env.example'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
      - 'README.md'
      - 'docs/VALIDATION.md'
      - 'app/version.py'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; it must match all release metadata
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version: ['v3.21.3', 'v4.2.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Verify aligned release metadata
        shell: bash
        run: |
          set -euo pipefail
          chart_version=$(helm show chart charts/nvd-mirror | awk '$1 == "version:" {gsub(/"/, "", $2); print $2}')
          app_version=$(helm show chart charts/nvd-mirror | awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}')
          python - "$chart_version" "$app_version" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          chart_version, chart_app_version = sys.argv[1:]
          pyproject_version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']

          source = pathlib.Path('app/version.py').read_text()
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
              raise SystemExit('Unable to read __version__ from app/version.py')
          application_version = match.group(1)

          env_source = pathlib.Path('.env.example').read_text()
          match = re.search(r'^NVD_MIRROR_IMAGE=.*:([^\s]+)$', env_source, re.MULTILINE)
          if not match:
              raise SystemExit('Unable to read NVD_MIRROR_IMAGE tag from .env.example')
          compose_image_version = match.group(1)

          dockerfile = pathlib.Path('Dockerfile').read_text()
          match = re.search(r'^ARG APP_VERSION=([^\s]+)$', dockerfile, re.MULTILINE)
          if not match:
              raise SystemExit('Unable to read APP_VERSION from Dockerfile')
          dockerfile_version = match.group(1)

          makefile = pathlib.Path('Makefile').read_text()
          match = re.search(r'^VERSION \?= ([^\s]+)$', makefile, re.MULTILINE)
          if not match:
              raise SystemExit('Unable to read VERSION from Makefile')
          makefile_version = match.group(1)

          versions = {
              'chart': chart_version,
              'chart appVersion': chart_app_version,
              'pyproject': pyproject_version,
              'application': application_version,
              'Compose image': compose_image_version,
              'Dockerfile': dockerfile_version,
              'Makefile': makefile_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Release versions are not aligned: {versions}')
          print(f'Aligned release version: {chart_version}')
          PY

      - name: Lint chart
        run: >-
          helm lint charts/nvd-mirror
          --set-string postgresql.auth.password=ci-password
          --set bootstrap.enabled=false

      - name: Render included PostgreSQL installation
        run: |
          helm template nvd-mirror charts/nvd-mirror \
            --namespace nvd-mirror \
            --set-string postgresql.auth.password=ci-password \
            --set bootstrap.enabled=false \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set-string ingress.hosts[0].host=nvd.example.org \
            > /tmp/nvd-mirror-internal.yaml
          test -s /tmp/nvd-mirror-internal.yaml

      - name: Render external PostgreSQL installation
        run: |
          helm template nvd-mirror charts/nvd-mirror \
            --namespace nvd-mirror \
            --set postgresql.enabled=false \
            --set-string database.url='postgresql+psycopg://nvd:password@postgres.example:5432/nvd' \
            --set bootstrap.enabled=false \
            > /tmp/nvd-mirror-external.yaml
          test -s /tmp/nvd-mirror-external.yaml

      - name: Package chart
        run: |
          mkdir -p dist
          chart_version=$(helm show chart charts/nvd-mirror | awk '$1 == "version:" {gsub(/"/, "", $2); print $2}')
          helm package charts/nvd-mirror --destination dist
          test -f "dist/nvd-mirror-${chart_version}.tgz"

  publish:
    name: Publish image, OCI chart, and GitHub release
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine and verify release version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chart_version=$(helm show chart charts/nvd-mirror | awk '$1 == "version:" {gsub(/"/, "", $2); print $2}')
          app_version=$(helm show chart charts/nvd-mirror | awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${REQUESTED_VERSION}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic, for example 0.2.0; got: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$chart_version" || "$version" != "$app_version" ]]; then
            echo "Requested version $version must match chart version $chart_version and appVersion $app_version" >&2
            exit 1
          fi
          python - "$version" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          expected = sys.argv[1]
          pyproject_version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']

          source = pathlib.Path('app/version.py').read_text()
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
              raise SystemExit('Unable to read __version__ from app/version.py')

          env_source = pathlib.Path('.env.example').read_text()
          env_match = re.search(r'^NVD_MIRROR_IMAGE=.*:([^\s]+)$', env_source, re.MULTILINE)
          if not env_match:
              raise SystemExit('Unable to read NVD_MIRROR_IMAGE tag from .env.example')

          versions = {
              'requested': expected,
              'pyproject': pyproject_version,
              'application': match.group(1),
              'Compose image': env_match.group(1),
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Release versions are not aligned: {versions}')
          PY
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/nvd-mirror"
          chart_repository="oci://ghcr.io/${owner}/charts"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "chart_repository=$chart_repository" >> "$GITHUB_OUTPUT"
          echo "chart_reference=${chart_repository}/nvd-mirror" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry for containers
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published application image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Package chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          helm package charts/nvd-mirror \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Log in to GitHub Container Registry for Helm
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push chart to GHCR
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          VERSION: ${{ steps.release.outputs.version }}
          CHART_REPOSITORY: ${{ steps.release.outputs.chart_repository }}
        run: helm push "dist/nvd-mirror-${VERSION}.tgz" "$CHART_REPOSITORY"

      - name: Verify published chart
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          CHART_REFERENCE: ${{ steps.release.outputs.chart_reference }}
          VERSION: ${{ steps.release.outputs.version }}
        run: helm show chart "$CHART_REFERENCE" --version "$VERSION"

      - name: Prepare GitHub release assets and notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          CHART_REFERENCE: ${{ steps.release.outputs.chart_reference }}
        shell: bash
        run: |
          set -euo pipefail
          cp docker-compose.yml dist/docker-compose.yml
          cp .env.example dist/nvd-mirror.env.example
          (
            cd dist
            sha256sum \
              docker-compose.yml \
              nvd-mirror.env.example \
              "nvd-mirror-${VERSION}.tgz" \
              > SHA256SUMS
          )
          cat > dist/release-notes.md <<EOF
          # nvd-mirror ${VERSION}

          This release is ready to deploy without cloning or building the source repository.

          ## Published artifacts

          | Artifact | Reference |
          |---|---|
          | Versioned application image | \`${IMAGE}:${VERSION}\` |
          | Convenience application image | \`${IMAGE}:latest\` |
          | OCI Helm chart | \`${CHART_REFERENCE}\` with \`--version ${VERSION}\` |
          | Docker Compose manifest | \`docker-compose.yml\` release asset |
          | Docker Compose environment template | \`nvd-mirror.env.example\` release asset |
          | Packaged Helm chart | \`nvd-mirror-${VERSION}.tgz\` release asset |

          The application version, Docker image tag, Helm chart version, and chart \`appVersion\` are all ${VERSION}.

          ## Docker Compose quick start

          \`docker-compose.yml\` pulls \`${IMAGE}:${VERSION}\`; it does not build the application locally.

          \`\`\`bash
          mkdir nvd-mirror && cd nvd-mirror
          curl -fL -o docker-compose.yml \\
            https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/docker-compose.yml
          curl -fL -o .env \\
            https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/nvd-mirror.env.example
          mkdir -p volumes/database volumes/nvd-feed-mirror-data volumes/certs
          # Edit POSTGRES_PASSWORD and DATABASE_URL in .env before starting.
          docker compose pull
          docker compose up -d
          docker compose --profile manual run --rm bootstrap
          \`\`\`

          Dashboard: \`http://localhost:8000/dashboard\`

          ## Helm quick start

          \`\`\`bash
          helm upgrade --install nvd-mirror \\
            ${CHART_REFERENCE} \\
            --version ${VERSION} \\
            --namespace nvd-mirror \\
            --create-namespace \\
            --set-string postgresql.auth.password='replace-with-a-strong-password'
          \`\`\`

          The chart pulls \`${IMAGE}:${VERSION}\` by default.

          ## Source development

          Source checkout and local image-build instructions are documented in [CONTRIBUTING.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CONTRIBUTING.md). End users do not need the source tree.
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "nvd-mirror ${VERSION}" \
              --notes-file dist/release-notes.md
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "nvd-mirror ${VERSION}" \
              --notes-file dist/release-notes.md
          fi
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/docker-compose.yml \
            dist/nvd-mirror.env.example \
            "dist/nvd-mirror-${VERSION}.tgz" \
            dist/SHA256SUMS

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          grep -qx 'docker-compose.yml' <<<"$assets"
          grep -qx 'nvd-mirror.env.example' <<<"$assets"
          grep -qx "nvd-mirror-${VERSION}.tgz" <<<"$assets"
          grep -qx 'SHA256SUMS' <<<"$assets"
