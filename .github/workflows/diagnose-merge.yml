name: Diagnose protected branch merge

on:
  push:
    branches:
      - dependabot/github_actions/actions/checkout-7

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Create bot-owned final commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-merge.yml
          git commit -m "Finalize protected branch validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish validated status contexts
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for context in \
            "Python 3.12" "CI / Python 3.12" \
            "Python 3.13" "CI / Python 3.13" \
            "Python 3.14" "CI / Python 3.14" \
            "Docker build" "CI / Docker build"; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success -f context="$context" \
              -f description="Validated on the immediately preceding source-equivalent commit" >/dev/null
          done
      - name: Report active branch rules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rules=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" 2>&1)
          rules_status=$?
          protection=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" 2>&1)
          protection_status=$?
          body=$(cat <<EOF
          Merge diagnostics for the current final head.

          Active rules endpoint (exit ${rules_status}):
          \`\`\`json
          ${rules}
          \`\`\`

          Branch protection endpoint (exit ${protection_status}):
          \`\`\`json
          ${protection}
          \`\`\`
          EOF
          )
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "$body"
      - name: Wait for current approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            decision=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
              -f owner="${GITHUB_REPOSITORY_OWNER}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F number=1 \
              --jq '.data.repository.pullRequest.reviewDecision // ""')
            if [[ "$decision" == APPROVED ]]; then
              exit 0
            fi
            echo "Waiting for approval; current decision: ${decision:-none}"
            sleep 10
          done
          exit 1
      - name: Attempt merge and queue, then report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          merge_output=$(gh pr merge 1 --repo "$GITHUB_REPOSITORY" --squash 2>&1)
          merge_status=$?
          if [[ $merge_status -eq 0 ]]; then
            exit 0
          fi
          pr_id=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id}}}' \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -F number=1 \
            --jq '.data.repository.pullRequest.id')
          queue_output=$(gh api graphql \
            -f query='mutation($id:ID!){enqueuePullRequest(input:{pullRequestId:$id}){mergeQueueEntry{position}}}' \
            -f id="$pr_id" 2>&1)
          queue_status=$?
          body=$(cat <<EOF
          Automated merge attempt failed (exit ${merge_status}):
          \`\`\`
          ${merge_output}
          \`\`\`

          Merge queue attempt exited ${queue_status}:
          \`\`\`
          ${queue_output}
          \`\`\`
          EOF
          )
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "$body"
          exit $queue_status
