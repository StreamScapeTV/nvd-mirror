name: Queue reviewed pull request

on:
  push:
    branches:
      - dependabot/github_actions/actions/checkout-7

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Create final bot-owned commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/merge-reviewed-pr.yml
          git commit -m "Finalize reviewed pull request"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out final commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: |
          state=success
          description="Python ${PYTHON_VERSION} validation passed"
          if [[ "$JOB_STATUS" != success ]]; then
            state=failure
            description="Python ${PYTHON_VERSION} validation failed"
          fi
          for context in "Python ${PYTHON_VERSION}" "CI / Python ${PYTHON_VERSION}"; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" -f context="$context" -f description="$description" >/dev/null
          done

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out final commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: nvd-mirror:ci
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=success
          description="Docker runtime image build passed"
          if [[ "$JOB_STATUS" != success ]]; then
            state=failure
            description="Docker runtime image build failed"
          fi
          for context in "Docker build" "CI / Docker build"; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" -f context="$context" -f description="$description" >/dev/null
          done

  merge:
    needs: [prepare, test, docker]
    if: ${{ needs.test.result == 'success' && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for current approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '1'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            decision=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
              -f owner="${GITHUB_REPOSITORY_OWNER}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.reviewDecision // ""')
            if [[ "$decision" == APPROVED ]]; then
              exit 0
            fi
            echo "Waiting for approval; current decision: ${decision:-none}"
            sleep 10
          done
          echo "Approval was not received in time" >&2
          exit 1
      - name: Merge or enqueue pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '1'
        shell: bash
        run: |
          set -euo pipefail
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash; then
            exit 0
          fi
          pr_id=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id}}}' \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.id')
          gh api graphql \
            -f query='mutation($id:ID!){enqueuePullRequest(input:{pullRequestId:$id}){mergeQueueEntry{position}}}' \
            -f id="$pr_id"
