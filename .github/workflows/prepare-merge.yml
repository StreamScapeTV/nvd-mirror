name: Prepare merge validation

on:
  push:
    branches:
      - dependabot/github_actions/actions/checkout-7

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create final bot-owned commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-merge.yml
          git commit -m "Finalize merge validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run CI on final commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
